name: Validate

on:
  # push is here deliberately. With only `pull_request`, a commit that lands on the
  # default branch without a PR is never hassfest-validated: four invalid error-string
  # blocks sat on a branch through a whole release cycle because the tests workflow was
  # green and this one only ever ran on PRs.
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
